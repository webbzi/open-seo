# notebook tiers: route by task shape. budget_usd is a runaway ceiling in API-equivalent dollars, far above
# a normal task (tilepoch senior tasks: median $9, largest $75). 0 means no cap.
[tier.quick]
agent = "quick-implementer"
model = "haiku"
effort = "medium"
budget_usd = 3.0

[tier.scoped]
agent = "scoped-implementer"
model = "sonnet"
effort = "medium"
budget_usd = 15.0

[tier.senior]
agent = "senior-implementer"
model = "opus"
effort = "high"
budget_usd = 100.0

[tier.architect]
agent = "staff-architect"
model = "opus"
effort = "xhigh"
budget_usd = 40.0
readonly = true

[tier.research]
agent = "researcher"
model = "sonnet"
effort = "medium"
budget_usd = 10.0
readonly = true

[worker]
# Allowed without asking, added to nb's built-in rules (read-only git and shell commands,
# `git add`, `git commit`, reading cargo and Go dependency source): the repo's build and test
# commands. Claude Code checks these itself; a path outside the worktree still comes to the
# policy and is refused. The task's acceptance command is allowed as well. A built-in rule
# that deny covers is dropped.
allowed_tools = [
  "Bash(pnpm install:*)",
  "Bash(pnpm vitest:*)",
  "Bash(pnpm test:*)",
  "Bash(pnpm types:check:*)",
  "Bash(pnpm lint:*)",
  "Bash(pnpm format:check:*)",
  "Bash(pnpm db:generate:*)",
  "Bash(pnpm exec vitest:*)",
  "Bash(pnpm exec tsc:*)",
  "Bash(pnpm exec oxlint:*)",
  "Bash(pnpm exec prettier:*)",
  "Bash(pnpm exec drizzle-kit generate:*)",
  "Bash(pnpm knip:*)",
  "Bash(pnpm exec knip:*)",
]
# Refused outright: the owner pushes, switches branches and manages worktrees.
deny = ["Bash(git push:*)", "Bash(git reset --hard:*)", "Bash(git clean:*)", "Bash(git worktree:*)", "Bash(git checkout:*)", "Bash(git switch:*)", "Bash(sudo:*)"]
# Anything else that needs approval: "ask" the owner (nb allow / nb deny), "allow", or "deny".
unknown = "ask"
ask_timeout_secs = 120
